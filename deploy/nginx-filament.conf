# Учёт филамента: https://<ваш сайт>/filament/ (подключается в HTTPS-блок сайта, см. install.sh)
location = /filament { return 301 /filament/; }
location /filament/ {
    limit_req zone=perip burst=40 nodelay;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
    # только реальный адрес клиента: присланный им X-Forwarded-For не передаём (ProxyFix x_for=1)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /filament;

    # add_header в location отменяет унаследованные из server — повторяем их.
    # Отличие от snippets/security-headers.conf: камера разрешена своему сайту (сканер QR этикеток).
    # CSP ставит приложение.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# Запросы по IP или с чужим именем хоста на 443 — сбрасываются, а не попадают в основной сайт.
# nginx 1.18 не умеет ssl_reject_handshake, поэтому самоподписанный сертификат-заглушка.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

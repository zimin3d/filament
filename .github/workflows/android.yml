# Сборка APK. Запуск: метка версии (git tag v1.0 && git push --tags) — APK появится в Releases;
# или вручную на вкладке Actions — APK будет в артефактах сборки.
# Нужны секреты репозитория: KEYSTORE_B64 (ключ подписи в base64) и KEYSTORE_PASSWORD;
# без них — проверочная сборка с отладочным ключом (в Releases не выкладывается).
name: Android APK

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy компилирует код той же версией Python
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
        with:
          gradle-version: "8.7"

      - name: Тесты
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            # проверочная сборка: отладочный ключ, в Releases не попадает
            echo "::warning::Нет секрета KEYSTORE_B64 — APK подписан отладочным ключом, только для проверки"
          else
            # пробелы и переносы, попавшие при вставке секрета, не мешают
            B64="$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')"
            # лишние символы после «=» в конце (ошибка копирования) — отрезаем; верность ключа проверит keytool
            if ! printf '%s' "$B64" | python3 -c "import base64,sys; s=sys.stdin.read(); s=s[:s.rfind('=')+1] if '=' in s else s; s=s.rstrip('='); s+='='*(-len(s)%4); sys.stdout.buffer.write(base64.b64decode(s, validate=True))" > "$RUNNER_TEMP/filament.p12" 2>/dev/null; then
              echo "::error::KEYSTORE_B64 не расшифровывается: вставьте одну строку из ~/.android-keys/filament.p12.b64"
              exit 1
            fi
            echo "KEYSTORE_FILE=$RUNNER_TEMP/filament.p12" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Проверка пароля ключа
        if: env.SIGNED == '1'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          keytool -list -storetype pkcs12 -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias filament > /dev/null

      - name: Сборка
        env:  # пароль ключа — только в этом шаге, не в GITHUB_ENV (его видят все шаги и сторонние actions)
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          export KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          bash android/prepare.sh
          gradle -p android assembleRelease --no-daemon
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/filament-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: filament-apk
          path: out/*.apk

      - name: Релиз
        if: github.ref_type == 'tag' && env.SIGNED == '1'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: out/*.apk

# Сборка APK. Запуск: метка версии (git tag v1.0 && git push --tags) — APK появится в Releases;
# или вручную на вкладке Actions — APK будет в артефактах сборки.
# Нужны секреты репозитория: KEYSTORE_B64 (ключ подписи в base64) и KEYSTORE_PASSWORD;
# без них — проверочная сборка с отладочным ключом (в Releases не выкладывается).
name: Android APK

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5  # Chaquopy компилирует код той же версией Python
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Тесты
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            # проверочная сборка: отладочный ключ, в Releases не попадает
            echo "::warning::Нет секрета KEYSTORE_B64 — APK подписан отладочным ключом, только для проверки"
          else
            # пробелы и переносы, попавшие при вставке секрета, не мешают
            B64="$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')"
            BAD="$(printf '%s' "$B64" | tr -d 'A-Za-z0-9+/=' | wc -c)"
            # без содержимого ключа: только длина и признаки, по которым видно, что вставлено не то
            echo "::notice::KEYSTORE_B64: длина ${#B64} (ожидается 1192), лишних символов $BAD, начало MIID: $([ "${B64:0:4}" = MIID ] && echo да || echo нет)"
            if ! printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/filament.p12" 2>/dev/null; then
              echo "::error::KEYSTORE_B64 не расшифровывается: вставьте одну строку из ~/.android-keys/filament.p12.b64"
              exit 1
            fi
            echo "KEYSTORE_FILE=$RUNNER_TEMP/filament.p12" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Проверка пароля ключа
        if: env.SIGNED == '1'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          keytool -list -storetype pkcs12 -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias filament > /dev/null
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Сборка
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          bash android/prepare.sh
          gradle -p android assembleRelease --no-daemon
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/filament-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: filament-apk
          path: out/*.apk

      - name: Релиз
        if: github.ref_type == 'tag' && env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk

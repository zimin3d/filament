# Тесты и проверка того, что попадёт в APK, — на каждый push (сам APK собирает android.yml:
# по метке версии и при изменениях в android/). Так поломку бандла из-за корневых модулей видно сразу.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Тесты
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - name: Приложение для телефона запускается из бандла
        run: PYTHON=python bash android/prepare.sh

{% extends "base.html" %}
{% block title %}Сканер{% endblock %}
{% block content %}
<h1>Сканер этикеток</h1>
<div class="scan-box">
  <video id="scan-video" muted playsinline></video>
  <div class="scan-frame" aria-hidden="true"></div>
</div>
<p id="scan-status" class="scan-status" role="status">Запуск камеры…</p>
<form id="scan-manual" class="scan-manual">
  <input name="number" inputmode="numeric" placeholder="…или номер катушки" autocomplete="off" class="big-input" enterkeyhint="go" aria-label="Номер катушки">
  <button class="btn primary lg">Найти</button>
</form>
<script src="{{ url_for('static', filename='vendor/jsqr/jsQR.js') }}"></script>
<script src="{{ url_for('static', filename='scan.js') }}"></script>
{% endblock %}
